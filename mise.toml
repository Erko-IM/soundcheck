# The tools the checks run with besides Rust's, which rust-toolchain.toml
# names: these versions on the Mac, in the git hooks and on the CI workflow's
# runners alike. `make hooks` installs them.
[tools]
actionlint = "1.7.12"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
lefthook = "2.1.16"
shellcheck = "0.11.0"

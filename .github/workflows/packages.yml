name: Packages

# Builds the installable packages on each platform's own runner, with the
# same make targets as a build at home: a .dmg for Macs, Apple silicon and
# Intel both, an NSIS installer .exe for Windows, and a .deb plus an AppImage
# for Linux.
# Run by hand, it leaves them as downloadable artifacts, which tries the
# builds on real Windows and Linux. Releases come from `make release` on a
# Mac instead, which builds its own.
#
# No build cache on purpose: anything able to write a cache entry would get
# to shape the binaries.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: dmg
            output: soundcheck.dmg
          - runner: windows-2025
            target: exe
            output: soundcheck-setup.exe
          # The oldest supported Ubuntu, so the AppImage runs on older distros.
          - runner: ubuntu-22.04
            target: linux
            output: |
              soundcheck.deb
              soundcheck.AppImage
    runs-on: ${{ matrix.runner }}
    # Windows runs steps in PowerShell by default, which reads $TARGET as
    # one of its own variables rather than from the environment. make's
    # recipes need Git Bash there anyway.
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the version, so this matches what make builds with.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # make installs cargo-packager itself, the version its Makefile names.
      - name: Package
        run: make "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soundcheck-${{ runner.os }}
          path: ${{ matrix.output }}
          if-no-files-found: error


[package]
name = "soundcheck"
version = "0.1.0"
edition = "2024"
description = "Fast spectrogram and spectrum viewer for field recordings"
publish = false

[dependencies]
colorous = "1.0.16"
cpal = "0.18.2"
eframe = { version = "0.36.2", features = ["persistence"] }
rayon = "1.12.0"
realfft = "3.5.0"
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["AE", "AEDataModel", "AppleEvents"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSString",
    "NSURL",
    "objc2-core-services",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# Unoptimised FFT and sample decoding are too slow to use even while
# debugging, so dependencies are always optimised and our own code gets
# enough optimisation to keep file opening instant.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.packager]
product-name = "soundcheck"
identifier = "io.github.erko-im.soundcheck"
category = "Music"
before-packaging-command = "cargo build --release"
out-dir = "target/packages"

[package.metadata.packager.macos]
info-plist-path = "packaging/Info.plist"
# "-" signs ad hoc, which seals the whole app: without it a downloaded copy
# is "damaged".
signing-identity = "-"

[package.metadata.packager.deb]
desktop-template = "packaging/soundcheck.desktop"
